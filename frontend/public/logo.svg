<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4a1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Balón de fútbol a la izquierda -->
  <circle cx="30" cy="30" r="24" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
  <!-- Paneles del balón -->
  <polygon points="30,10 37,16 35,24 25,24 23,16" fill="url(#ballGrad)" opacity="0.95"/>
  <polygon points="37,16 45,19 44,28 37,32 35,24" fill="#1f2937" stroke="#00d4a1" stroke-width="0.8"/>
  <polygon points="23,16 15,19 16,28 23,32 25,24" fill="#1f2937" stroke="#00d4a1" stroke-width="0.8"/>
  <polygon points="23,32 25,40 35,40 37,32 35,24 25,24" fill="#111827" stroke="#00d4a1" stroke-width="0.8"/>
  <polygon points="16,28 18,36 25,40 23,32" fill="url(#ballGrad)" opacity="0.55"/>
  <polygon points="44,28 42,36 35,40 37,32" fill="url(#ballGrad)" opacity="0.55"/>
  <!-- Brillo balón -->
  <circle cx="25" cy="20" r="4" fill="white" opacity="0.1"/>
  <!-- Texto LALAND -->
  <text x="66" y="28" font-family="Inter, system-ui, sans-serif"
        font-size="22" font-weight="900" letter-spacing="2"
        fill="#f9fafb">LALAND</text>
  <!-- Texto FOOTBALL -->
  <text x="67" y="46" font-family="Inter, system-ui, sans-serif"
        font-size="11" font-weight="400" letter-spacing="5"
        fill="#00d4a1" opacity="0.85">FOOTBALL</text>
  <!-- Línea acento verde bajo FOOTBALL -->
  <rect x="67" y="50" width="56" height="1.5" rx="1" fill="#00d4a1" opacity="0.4"/>
</svg>
