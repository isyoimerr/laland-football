<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="screen-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141f2e"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg-grad)"/>

  <!-- Phone 1 (left, tilted) -->
  <g transform="rotate(-8, 180, 200)" filter="url(#shadow)">
    <rect x="100" y="60" width="160" height="290" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="108" y="80" width="144" height="252" rx="6" fill="url(#screen-grad)"/>
    <!-- Screen content -->
    <rect x="116" y="90" width="128" height="18" rx="4" fill="#00d4a1" opacity="0.2"/>
    <text x="180" y="103" text-anchor="middle" font-size="8" fill="#00d4a1" font-family="sans-serif" font-weight="bold">LIVE · 65'</text>
    <!-- Score -->
    <text x="180" y="125" text-anchor="middle" font-size="22" fill="white" font-family="sans-serif" font-weight="bold">2 - 1</text>
    <text x="148" y="138" text-anchor="middle" font-size="7" fill="#94a3b8" font-family="sans-serif">RM</text>
    <text x="212" y="138" text-anchor="middle" font-size="7" fill="#94a3b8" font-family="sans-serif">BAR</text>
    <!-- Mini pitch -->
    <rect x="116" y="148" width="128" height="70" rx="4" fill="#1a3a1a"/>
    <ellipse cx="180" cy="183" rx="18" ry="18" stroke="#2d5a2d" stroke-width="1" fill="none"/>
    <line x1="180" y1="148" x2="180" y2="218" stroke="#2d5a2d" stroke-width="0.8"/>
    <!-- Stats bars -->
    <rect x="120" y="228" width="50" height="4" rx="2" fill="#00d4a1" opacity="0.7"/>
    <rect x="170" y="228" width="70" height="4" rx="2" fill="#3b82f6" opacity="0.5"/>
    <rect x="120" y="238" width="80" height="4" rx="2" fill="#00d4a1" opacity="0.5"/>
    <rect x="200" y="238" width="40" height="4" rx="2" fill="#3b82f6" opacity="0.4"/>
    <!-- Bottom nav -->
    <rect x="108" y="318" width="144" height="14" rx="0" fill="#0f1929"/>
    <circle cx="140" cy="325" r="4" fill="#00d4a1"/>
    <circle cx="168" cy="325" r="4" fill="#334155"/>
    <circle cx="196" cy="325" r="4" fill="#334155"/>
    <circle cx="224" cy="325" r="4" fill="#334155"/>
    <!-- Home button area -->
    <rect x="160" y="342" width="40" height="4" rx="2" fill="#334155"/>
    <!-- Camera notch -->
    <rect x="162" y="66" width="36" height="8" rx="4" fill="#0f1929"/>
    <circle cx="180" cy="70" r="2" fill="#1e293b"/>
  </g>

  <!-- Phone 2 (center, front) -->
  <g transform="translate(30, 0)" filter="url(#shadow)">
    <rect x="230" y="30" width="180" height="330" rx="24" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="240" y="54" width="160" height="288" rx="8" fill="url(#screen-grad)"/>
    <!-- Top bar -->
    <rect x="248" y="62" width="144" height="24" rx="4" fill="#0f1929"/>
    <text x="320" y="78" text-anchor="middle" font-size="9" fill="#00d4a1" font-family="sans-serif" font-weight="bold" letter-spacing="1">LALAND FOOTBALL</text>
    <!-- Match card -->
    <rect x="248" y="94" width="144" height="80" rx="8" fill="#1e3a5f" stroke="#1e4080" stroke-width="1"/>
    <text x="272" y="112" font-size="8" fill="#f59e0b" font-family="sans-serif" font-weight="bold">● EN VIVO · 73'</text>
    <text x="320" y="134" text-anchor="middle" font-size="26" fill="white" font-family="sans-serif" font-weight="bold">3 - 2</text>
    <text x="275" y="148" text-anchor="middle" font-size="8" fill="#94a3b8" font-family="sans-serif">Real Madrid</text>
    <text x="365" y="148" text-anchor="middle" font-size="8" fill="#94a3b8" font-family="sans-serif">Barcelona</text>
    <text x="320" y="166" text-anchor="middle" font-size="7" fill="#00d4a1" font-family="sans-serif">xG: 2.4 — 1.8</text>
    <!-- Stats section -->
    <text x="248" y="190" font-size="8" fill="#64748b" font-family="sans-serif">POSESIÓN</text>
    <rect x="248" y="196" width="90" height="6" rx="3" fill="#00d4a1" opacity="0.8"/>
    <rect x="338" y="196" width="54" height="6" rx="3" fill="#3b82f6" opacity="0.5"/>
    <text x="248" y="216" font-size="8" fill="#64748b" font-family="sans-serif">TIROS</text>
    <rect x="248" y="222" width="70" height="6" rx="3" fill="#00d4a1" opacity="0.7"/>
    <rect x="318" y="222" width="74" height="6" rx="3" fill="#3b82f6" opacity="0.5"/>
    <!-- Top scorers mini -->
    <rect x="248" y="238" width="144" height="60" rx="8" fill="#141f2e" stroke="#1e293b" stroke-width="1"/>
    <text x="320" y="252" text-anchor="middle" font-size="7" fill="#64748b" font-family="sans-serif">TOP GOLEADORES</text>
    <circle cx="260" cy="268" r="8" fill="#1e3a5f"/>
    <text x="260" y="271" text-anchor="middle" font-size="6" fill="white" font-family="sans-serif">CR7</text>
    <text x="280" y="266" font-size="7" fill="#e2e8f0" font-family="sans-serif">Cristiano R.</text>
    <text x="375" y="266" font-size="7" fill="#00d4a1" font-family="sans-serif">28 ⚽</text>
    <circle cx="260" cy="284" r="8" fill="#1e3a5f"/>
    <text x="260" y="287" text-anchor="middle" font-size="6" fill="white" font-family="sans-serif">10</text>
    <text x="280" y="282" font-size="7" fill="#e2e8f0" font-family="sans-serif">L. Messi</text>
    <text x="375" y="282" font-size="7" fill="#00d4a1" font-family="sans-serif">25 ⚽</text>
    <!-- Bottom section -->
    <rect x="248" y="308" width="60" height="26" rx="6" fill="#00d4a1" opacity="0.15" stroke="#00d4a1" stroke-width="1"/>
    <text x="278" y="325" text-anchor="middle" font-size="7" fill="#00d4a1" font-family="sans-serif">INICIO</text>
    <rect x="314" y="308" width="60" height="26" rx="6" fill="#141f2e"/>
    <text x="344" y="325" text-anchor="middle" font-size="7" fill="#64748b" font-family="sans-serif">LIGAS</text>
    <!-- Notch -->
    <rect x="290" y="37" width="60" height="10" rx="5" fill="#0f1929"/>
    <circle cx="320" cy="42" r="2.5" fill="#1e293b"/>
    <!-- Home indicator -->
    <rect x="290" y="350" width="60" height="4" rx="2" fill="#475569"/>
  </g>

  <!-- Phone 3 (right, tilted) -->
  <g transform="rotate(8, 460, 200) translate(50,0)" filter="url(#shadow)">
    <rect x="360" y="60" width="160" height="290" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="368" y="80" width="144" height="252" rx="6" fill="url(#screen-grad)"/>
    <!-- AI Predictions header -->
    <rect x="376" y="88" width="128" height="20" rx="4" fill="#7c3aed" opacity="0.2"/>
    <text x="440" y="101" text-anchor="middle" font-size="8" fill="#a78bfa" font-family="sans-serif" font-weight="bold">🤖 PREDICCIÓN IA</text>
    <!-- Probability bars -->
    <text x="376" y="122" font-size="7" fill="#94a3b8" font-family="sans-serif">Victoria local</text>
    <rect x="376" y="126" width="84" height="8" rx="4" fill="#00d4a1" opacity="0.8"/>
    <rect x="460" y="126" width="44" height="8" rx="4" fill="#1e293b"/>
    <text x="508" y="133" font-size="7" fill="#00d4a1" font-family="sans-serif">66%</text>
    <text x="376" y="148" font-size="7" fill="#94a3b8" font-family="sans-serif">Empate</text>
    <rect x="376" y="152" width="30" height="8" rx="4" fill="#f59e0b" opacity="0.7"/>
    <text x="508" y="159" font-size="7" fill="#f59e0b" font-family="sans-serif">24%</text>
    <text x="376" y="174" font-size="7" fill="#94a3b8" font-family="sans-serif">Victoria visitante</text>
    <rect x="376" y="178" width="13" height="8" rx="4" fill="#ef4444" opacity="0.7"/>
    <text x="508" y="185" font-size="7" fill="#ef4444" font-family="sans-serif">10%</text>
    <!-- Heat map mini -->
    <rect x="376" y="198" width="128" height="70" rx="6" fill="#0f1929"/>
    <text x="440" y="212" text-anchor="middle" font-size="7" fill="#64748b" font-family="sans-serif">MAPA DE CALOR</text>
    <circle cx="420" cy="240" r="15" fill="#00d4a1" opacity="0.3"/>
    <circle cx="420" cy="240" r="8" fill="#00d4a1" opacity="0.5"/>
    <circle cx="450" cy="232" r="10" fill="#3b82f6" opacity="0.3"/>
    <!-- Notifications -->
    <rect x="376" y="278" width="128" height="30" rx="6" fill="#f59e0b" opacity="0.1" stroke="#f59e0b44" stroke-width="1"/>
    <text x="384" y="290" font-size="7" fill="#f59e0b" font-family="sans-serif" font-weight="bold">⚽ GOL — min 71'</text>
    <text x="384" y="302" font-size="6" fill="#94a3b8" font-family="sans-serif">Vinicius Jr. — Real Madrid</text>
    <!-- Home button -->
    <rect x="420" y="342" width="40" height="4" rx="2" fill="#334155"/>
    <!-- Notch -->
    <rect x="412" y="66" width="36" height="8" rx="4" fill="#0f1929"/>
  </g>

  <!-- Glow effects -->
  <ellipse cx="180" cy="350" rx="100" ry="20" fill="#00d4a1" opacity="0.08"/>
  <ellipse cx="350" cy="370" rx="120" ry="20" fill="#3b82f6" opacity="0.08"/>
  <ellipse cx="520" cy="350" rx="100" ry="20" fill="#7c3aed" opacity="0.08"/>
</svg>
